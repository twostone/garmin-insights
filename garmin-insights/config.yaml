# https://developers.home-assistant.io/docs/apps/configuration
name: Garmin Insights
# Managed by Release Please (see release-please-config.json): do not edit the version by hand.
version: "0.2.0" # x-release-please-version
slug: garmin_insights
description: Garmin-Daten lokal spiegeln, auswerten und per PWA, REST-API und MCP nutzen
url: "https://github.com/twostone/garmin-insights"
arch:
  - aarch64
  - amd64
# Home Assistant 2026.10.1 brings PKCE (S256), client-ID metadata documents and loopback redirects for OAuth.
homeassistant: "2026.10.1"
# Prebuilt by the release workflow. No tag here: Home Assistant appends "version" as the tag.
image: ghcr.io/twostone/garmin-insights
ingress: true
ingress_port: 8099
panel_icon: mdi:run-fast
panel_title: Garmin Insights
# Every Home Assistant user gets their own Garmin key and data; the app separates them by user id.
panel_admin: false
# 8099 is Ingress only (not mapped). 8100 is the external listener (PWA + MCP, Bearer tokens from Home Assistant).
# Put it behind a TLS reverse proxy; the app itself speaks plain HTTP there.
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: "Externer Zugriff (PWA/MCP) - hinter einem TLS-Reverse-Proxy betreiben"
# Notifications (key about to expire) go through the Supervisor's Core proxy.
homeassistant_api: true
# Options land in /data/options.json (written by the Supervisor); a change needs a restart.
options:
  log_level: info
  ha_external_url: ""
  app_external_url: ""
  sync_interval_minutes: 30
schema:
  log_level: list(debug|info|warning|error)
  ha_external_url: url?
  app_external_url: url?
  sync_interval_minutes: int(5,1440)
