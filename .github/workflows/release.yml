name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Opens/updates the release PR from the conventional commits. Merging it bumps the version
  # (garmin-insights/config.yaml, package.json), writes the CHANGELOG, tags vX.Y.Z and creates the GitHub release.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Runs with RELEASE_PLEASE_TOKEN (fine-grained PAT: contents, pull requests, issues read/write), not GITHUB_TOKEN,
    # so the release PR gets the usual checks. GITHUB_TOKEN is not used here, hence read-only.
    permissions:
      contents: read
    outputs:
      addon_released: ${{ steps.rp.outputs['garmin-insights--release_created'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Tests run again on the release commit, in the same workflow run, so the image is only built from a
  # commit that passed. Runs only when a release was just created.
  ci:
    name: CI
    needs: release-please
    if: ${{ needs.release-please.outputs.addon_released == 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Builds and pushes ghcr.io/<repo>:<version>, then asks twostone/hassio-apps to pull the release.
  publish:
    name: Veröffentlichen
    needs: [release-please, ci]
    if: ${{ needs.release-please.outputs.addon_released == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: twostone/hassio-workflows/.github/workflows/app-publish.yml@e8fa22248618d4114434940c6f7f44d77270e6ca # v1.0.0
    with:
      app-dir: garmin-insights
      slug: garmin_insights
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
